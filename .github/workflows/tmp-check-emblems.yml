name: tmp check emblems
on:
  push:
    branches: [claude/kind-thompson-q7ahjr]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q pillow
          B=https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem
          for t in iron bronze silver gold platinum emerald diamond master grandmaster challenger; do
            curl -s -o /tmp/$t.png "$B/emblem-$t.png"
            python3 -c "
          from PIL import Image
          im=Image.open('/tmp/$t.png'); w,h=im.size; a=im.getchannel('A').point(lambda v: 255 if v>24 else 0); b=a.getbbox()
          print('$t', w, h, b, 'frac', [round(b[0]/w,4), round(b[1]/h,4), round(b[2]/w,4), round(b[3]/h,4)])"
          done
