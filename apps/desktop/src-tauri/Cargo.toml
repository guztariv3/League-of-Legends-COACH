[package]
name = "kairos-desktop"
version = "0.1.0"
description = "KOI Master — Live Coach side window"
edition = "2021"
publish = false

[lib]
name = "kairos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Signed auto-updates (release builds only; configured by the release workflow, docs/10-despliegue.md).
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tauri-plugin-updater = { version = "2", optional = true }

[profile.release]
# Small, lean binary: the Live Coach must stay out of the game's way.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
