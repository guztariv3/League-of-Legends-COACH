# Render Blueprint (decision D-08): one web service (API + web, Docker) and
# managed Postgres, both in Frankfurt. Secrets use `sync: false`, so Render
# asks for them when the Blueprint is created; they never live in the repo.
# Plan names and prices must be confirmed in the Render dashboard (docs/10-despliegue.md).
services:
  - type: web
    name: kairos-coach
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kairos-db
          property: connectionString
      # Private prototype: whole site behind a shared password (≥ 12 characters).
      - key: PROTOTYPE_PASSWORD
        sync: false
      # Development login is only honoured in production when PROTOTYPE_PASSWORD is set.
      - key: DEV_LOGIN
        value: "1"
      # Without a key the app runs on clearly labelled synthetic data.
      - key: RIOT_API_KEY
        sync: false
      # Decision D-07.
      - key: AI_MODEL
        value: claude-opus-5
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: kairos-db
    plan: basic-256mb
    region: frankfurt
    databaseName: kairos
    user: kairos
    postgresMajorVersion: "16"
