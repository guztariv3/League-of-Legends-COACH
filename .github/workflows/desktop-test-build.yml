name: Desktop test build

# Unsigned Windows installer for trying the desktop app, without the updater.
# Run it from Actions → "Desktop test build" → "Run workflow", then download the
# "KOI-Master-Windows" artifact. Signed, auto-updating releases use desktop-release.yml.
# With "publish" ticked it also creates a public GitHub Release (marked latest), so anyone can
# download it from the Releases page or the site's /info/ download button, without a GitHub account.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar como versión de prueba pública (Releases)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/live/**"
      - "packages/itemization/**"
      - "packages/ui/**"
      - ".github/workflows/desktop-test-build.yml"

concurrency:
  group: desktop-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer (unsigned)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # No `--features updater`: a test build must not look for an update feed or a signing key.
      - run: pnpm --filter @coach/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: KOI-Master-Windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
      - name: Publish as a public test release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="desktop-test-${{ github.run_number }}"
          gh release create "$tag" apps/desktop/src-tauri/target/release/bundle/nsis/*.exe \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "KOI Master para Windows (versión de prueba ${{ github.run_number }})" \
            --notes "Descarga el archivo .exe y ábrelo. Windows mostrará \"Windows protegió su PC\" porque el instalador aún no tiene firma de Microsoft: pulsa Más información → Ejecutar de todas formas. Esta versión no se actualiza sola: para una versión nueva, descárgala de nuevo desde aquí."
