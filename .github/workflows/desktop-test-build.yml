name: Desktop test build

# Unsigned Windows installer for trying the desktop app, without the updater.
# Run it from Actions → "Desktop test build" → "Run workflow", then download the
# "KOI-Master-Windows" artifact. Signed, auto-updating releases use desktop-release.yml.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/live/**"
      - "packages/itemization/**"
      - "packages/ui/**"
      - ".github/workflows/desktop-test-build.yml"

concurrency:
  group: desktop-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer (unsigned)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # No `--features updater`: a test build must not look for an update feed or a signing key.
      - run: pnpm --filter @coach/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: KOI-Master-Windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
